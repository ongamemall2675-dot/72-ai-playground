<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>혜화 부동산 메타버스</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
:root{--bg:#0f172a;--panel:rgba(15,23,42,.92);--fg:#e2e8f0;--accent:#38bdf8;--muted:#94a3b8}
html,body,#map{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:'Pretendard','Noto Sans KR',sans-serif}
#ui{position:absolute;top:12px;left:12px;width:300px;max-width:calc(100% - 32px);max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border-radius:12px;padding:14px;box-sizing:border-box;z-index:10}
h1{font-size:17px;margin:0 0 4px}small{color:var(--muted)}
input,select,button{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:var(--fg)}
button{background:var(--accent);color:#0f172a;font-weight:700;cursor:pointer;border:0}
.item{padding:8px;border-radius:8px;background:#1e293b;margin:6px 0;cursor:pointer}.item:hover{outline:1px solid var(--accent)}
.item b{color:var(--accent)}
#detail{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#0b1220;border:1px solid var(--accent)}
.cesium-viewer-bottom{display:none}
#detail img{width:100%;border-radius:6px;margin-bottom:6px}
#detail a.cta{display:block;text-align:center;margin-top:8px;padding:9px;border-radius:8px;background:var(--accent);color:#0f172a;font-weight:700;text-decoration:none}
.row{display:flex;gap:6px}.row>*{flex:1}.mb{background:#334155;color:var(--fg)}.mb.on{background:var(--accent);color:#0f172a}.sub{background:#334155;color:var(--fg);font-size:13px}
#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:10px;border:1px solid var(--accent);display:none;z-index:11;max-width:80%}
body.clean #ui{display:none}
.pop{position:absolute;top:12px;right:12px;width:360px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px;z-index:12;display:none}
.pop .x,.rvbar button{width:auto;padding:4px 10px;margin:0 0 0 4px;background:#334155;color:var(--fg)}.pop .x{float:right}
#phMain img{width:100%;border-radius:8px;max-height:60vh;object-fit:contain;background:#000}#phThumbs{display:flex;gap:4px;overflow:auto}#phThumbs img{height:54px;border-radius:4px;cursor:pointer;opacity:.7}#phThumbs img:hover{opacity:1}
#rvModal{position:absolute;inset:5% 5% 5% 330px;background:#0f172a;border:1px solid var(--accent);border-radius:12px;z-index:13;display:none;flex-direction:column;padding:8px}
@media(max-width:800px){#rvModal{inset:8px}}
.rvbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#rv{flex:1;border-radius:8px;overflow:hidden}
#adm{display:none;font-size:12px;color:#facc15}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chip{width:auto;padding:5px 10px;margin:0;font-size:13px;background:#334155;color:var(--fg)}.chip.on{background:var(--accent);color:#0f172a}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;color:#0f172a}
</style>
</head>
<body>
<div id="map"></div><div id="toast"></div>
<div id="photoBox" class="pop"><button class="x" onclick="this.parentNode.style.display='none'">✕</button><div id="phMain"></div><div id="phThumbs"></div></div>
<div id="rvModal"><div class="rvbar"><b id="rvTitle">로드뷰</b><span><button id="rvPrev">◀ 이전</button><button id="rvNext">다음 ▶</button><button id="rvClose">✕ 닫기</button></span></div><div id="rv"></div><small id="rvNote"></small></div>
<div id="ui">
  <h1>🏙 혜화역 부동산 메타버스</h1>
  <small>V월드 3D 지도 · 대학로 혜화72공인중개사사무소 공개 매물</small>
  <input id="key" autocomplete="off" placeholder="V월드 API 인증키 (vworld.kr 발급)">
  <button id="applyKey">V월드 위성지도 + 3D 건물 적용</button>
  <small id="bstat"></small><div id="adm">🔑 관리자 모드: 정확한 위치로 경로·로드뷰를 보여 줍니다 (브리핑용)</div>
  <div id="types"></div><label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="onlyPhoto" style="width:auto;margin:0">📷 사진 있는 매물만</label>
  <select id="deal"><option value="">전체 거래</option><option>매매</option><option>전세</option><option>월세</option></select>
  <small id="cnt">매물장부 불러오는 중…</small>
  <div class="row"><button data-mode="3d" class="mb on">3D</button><button data-mode="25d" class="mb">2.5D</button><button data-mode="2d" class="mb">2D</button></div>
  <div class="row"><select id="style"><option value="osm">일반 지도</option><option value="dark">야간 지도</option><option value="vbase">V월드 기본</option><option value="vsat">V월드 위성</option></select>
  <select id="radius"><option value="500">반경 500m</option><option value="250">반경 250m</option><option value="1000">반경 1km</option><option value="0">반경 숨김</option></select></div>
  <input id="maxp" type="number" placeholder="최대 금액 (만원, 매매가·보증금)">
  <div class="row"><button id="ptour" class="sub">🎬 매물 순회</button></div>
  <div class="row"><button id="clean" class="sub">🎥 촬영 화면 (H)</button><button id="share" class="sub">🔗 링크 복사</button></div>
  <button id="fly" style="background:#334155;color:var(--fg)">📍 혜화역으로 이동 / 회전 투어</button>
  <div id="detail"></div>
  <div id="list"></div>
</div>
<script>
const STATION={lon:127.0018,lat:37.5822};
// 실제 매물: 업무관리 공개 매물 통로(홈페이지 공개 + 계약가능). 좌표는 통로가 주는 약 100m 단위 좌표만 쓴다(정확한 주소 노출 방지).
const ADM='https://admin.hyehwa72.org',API=ADM+'/sync/pub/listings?lite=1', SITE='https://hyehwa72.org/listing/';
let EXACT=null,RAW=null;
const TYPES=['전체','원룸·투룸','주택','오피스텔','상가','사무실','건물'];
const TYPE=c=>/원룸|투룸/.test(c)?'원룸·투룸':/3룸|빌라|단독|다가구|아파트/.test(c)?'주택':/오피스텔/.test(c)?'오피스텔':/상가/.test(c)?'상가':/사무실/.test(c)?'사무실':/건물/.test(c)?'건물':'주택';
let curType='전체';
const GROUP=c=>/상가|사무실/.test(c)?'상가·사무실':/원룸|투룸|3룸/.test(c)?'주거 임대':/오피스텔/.test(c)?'오피스텔':'매매 주택·건물';
const COLORS={'상가·사무실':'#f59e0b','주거 임대':'#34d399','오피스텔':'#a78bfa','매매 주택·건물':'#38bdf8'};
const viewer=new Cesium.Viewer('map',{baseLayer:Cesium.ImageryLayer.fromProviderAsync(Promise.resolve(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}))),
 baseLayerPicker:false,geocoder:false,timeline:false,animation:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,infoBox:false});
viewer.scene.globe.depthTestAgainstTerrain=false;
function setVworld(key){
  viewer.imageryLayers.removeAll();
  viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:`https://api.vworld.kr/req/wmts/1.0.0/${key}/Satellite/{z}/{y}/{x}.jpeg`,maximumLevel:19,credit:'V월드'}));
  viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:`https://api.vworld.kr/req/wmts/1.0.0/${key}/Hybrid/{z}/{y}/{x}.png`,maximumLevel:19}));
}
let saved='';try{saved=localStorage.getItem('vwkey')||''}catch(e){}
const keyEl=document.getElementById('key');if(saved)keyEl.placeholder='V월드 키 적용됨 (바꿀 때만 입력)';if(saved)setVworld(saved);
document.getElementById('applyKey').onclick=()=>{const k=keyEl.value.trim()||(localStorage.getItem('vwkey')||'');if(!k)return alert('V월드 인증키를 입력하세요');try{localStorage.setItem('vwkey',k)}catch(e){}setVworld(k);loadBuildings(k)};
// ── V월드 3D 건물: 도로명주소 건물(LT_C_SPBD) 폴리곤을 지상층수×3m로 돌출 ──
const bstat=document.getElementById('bstat');let bldSrc=null;
function jsonp(url){return new Promise((ok,no)=>{const cb='vw'+Math.random().toString(36).slice(2);const s=document.createElement('script');
 const t=setTimeout(()=>{cleanup();no(new Error('timeout'))},15000);
 function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=d=>{cleanup();ok(d)};s.onerror=()=>{cleanup();no(new Error('load'))};s.src=url+'&callback='+cb;document.head.appendChild(s)})}
async function loadBuildings(key){
 const d=0.006,box=`BOX(${STATION.lon-d},${STATION.lat-d*0.8},${STATION.lon+d},${STATION.lat+d*0.8})`;
 const feats=[];bstat.textContent='3D 건물 불러오는 중…';
 try{for(let page=1;page<=10;page++){
   const u=`https://api.vworld.kr/req/data?service=data&request=GetFeature&data=LT_C_SPBD&key=${key}&domain=${encodeURIComponent(location.origin)}&format=json&size=1000&page=${page}&geometry=true&attribute=true&crs=EPSG:4326&geomFilter=${box}`;
   const r=await jsonp(u),res=r.response;
   if(res.status!=='OK'){if(page===1)throw new Error(res.error?res.error.text:res.status);break}
   feats.push(...res.result.featureCollection.features);
   if(page>=+res.page.total)break}
 }catch(e){bstat.textContent='건물 로드 실패: '+e.message+' (인증키·등록 도메인 확인)';return}
 if(bldSrc)viewer.dataSources.remove(bldSrc);
 bldSrc=await Cesium.GeoJsonDataSource.load({type:'FeatureCollection',features:feats});
 bldSrc.entities.values.forEach(e=>{if(!e.polygon)return;const p=e.properties;
  const fl=Math.max(1,+(p.gro_flo_co&&p.gro_flo_co.getValue())||1);
  e.polygon.extrudedHeight=fl*3.2;e.polygon.height=0;e.polygon.outline=false;
  e.polygon.material=Cesium.Color.fromCssColorString('#e2e8f0').withAlpha(.85);
  e.description=undefined});
 viewer.dataSources.add(bldSrc);bstat.textContent=`V월드 건물 ${feats.length}동 표시 중`}
if(saved)loadBuildings(saved);
// 혜화역 마커
viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat,5),point:{pixelSize:14,color:Cesium.Color.fromCssColorString('#3b82f6'),outlineColor:Cesium.Color.WHITE,outlineWidth:3},
 label:{text:'🚇 혜화역',font:'bold 16px sans-serif',pixelOffset:new Cesium.Cartesian2(0,-24),fillColor:Cesium.Color.WHITE,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE}});
viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat),ellipse:{semiMajorAxis:500,semiMinorAxis:500,material:Cesium.Color.fromCssColorString('#3b82f6').withAlpha(.08),outline:true,outlineColor:Cesium.Color.fromCssColorString('#3b82f6')}});
// ── 매물 핀: 같은 100m 칸의 매물은 핀 하나로 묶는다 ──
let PROPS=[],cells=[],pins=[];
const won=v=>{v=+v;if(!v)return '';const e=Math.floor(v/10000),m=v%10000;return (e?e+'억':'')+(m?(e?' ':'')+m.toLocaleString()+'만':'')};
function priceTxt(p){if(p.deal==='매매')return '매매 '+won(p.price);
 const d=p.deposit?won(p.deposit):'',r=(+p.rent)?' / 월 '+(+p.rent).toLocaleString()+'만':'';return (p.deal||'임대')+' '+(d||'협의')+r}
function walk(p){try{const s=JSON.parse(p.near_st).st.find(x=>x.name==='혜화역');return s?'혜화역 도보 약 '+s.min+'분':''}catch(e){return ''}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const detail=document.getElementById('detail');
function show(p){stopAll();history.replaceState(null,'','#'+p.id);detail.style.display='block';const g=GROUP(p.cat);
 detail.innerHTML=`<span class="tag" style="background:${COLORS[g]}">${esc(p.cat)}</span>${p.hp_pick?'<span class="tag" style="background:#f87171">'+esc(p.hp_pick)+'</span>':''}
 <br><b style="color:${COLORS[g]}">${esc(p.dong)} ${esc(p.bldg_type||'')}</b><div class="row" style="margin:6px 0"><button onclick="openRV(${p.id})">🛣 로드뷰</button>${p.has_photo?`<button onclick="openPhotos(${p.id})">📷 사진</button>`:''}</div><br>💰 ${priceTxt(p)}${p.mgmt?' · 관리비 '+p.mgmt+'만':''}
 <br>📐 ${esc(p.area_py||(p.excl_m2?p.excl_m2+'㎡':''))} · ${esc(p.floor||'')} ${esc(p.rooms||'')}<br>🚶 ${walk(p)}
 <br><small>${esc((p.ad_desc||'').split('\n')[1]||'').slice(0,120)}</small><br><small>매물번호 ${p.id} · ${EXACT?'관리자: 정확한 위치':'위치는 약 100m 범위로 표시'}</small>
 <a class="cta" href="${SITE}${p.id}" target="_blank">매물 자세히 보기 · 문의하기</a>`;
 $('photoBox').style.display='none';routeTo(p.id,false);if(p.has_photo)openPhotos(p.id)}
function showCell(c){detail.style.display='block';detail.innerHTML='<b>이 구역 매물 '+c.items.length+'건</b>'+c.items.map(p=>`<div class="item" data-id="${p.id}"><small>${esc(p.cat)} · ${priceTxt(p)}</small></div>`).join('');detail.querySelectorAll('.item').forEach(el=>el.onclick=()=>show(PROPS.find(p=>p.id==el.dataset.id)))}
function cellList(c){stopAll();detail.style.display='block';detail.innerHTML='<b>이 구역 매물 '+c.items.length+'건</b>'+c.items.map(p=>`<div class="item" data-id="${p.id}"><small>${esc(p.cat)} · ${priceTxt(p)} · ${esc(p.floor||'')}</small></div>`).join('');
 detail.querySelectorAll('.item').forEach(el=>el.onclick=()=>show(PROPS.find(p=>p.id==el.dataset.id)));
 viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(c.lng,c.lat,20),60),{offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-45),550),duration:1.5});}
function filtered(){const d=document.getElementById('deal').value,op=document.getElementById('onlyPhoto').checked;
 const mx=+document.getElementById('maxp').value||0;
 return PROPS.filter(p=>(curType==='전체'||TYPE(p.cat)===curType)&&(!op||p.has_photo)&&(!d||p.deal===d)&&(!mx||((p.deal==='매매'?+p.price:+p.deposit)||0)<=mx))}
function render(){pins.forEach(e=>viewer.entities.remove(e));pins=[];
 const list=filtered(),m={};list.forEach(p=>{const k=p.lat+','+p.lng;(m[k]=m[k]||{lat:p.lat,lng:p.lng,items:[]}).items.push(p)});
 cells=Object.values(m);
 cells.forEach((c,i)=>{const g=GROUP(c.items[0].cat),col=Cesium.Color.fromCssColorString(COLORS[g]),H=70;
  pins.push(viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights([c.lng,c.lat,0,c.lng,c.lat,H]),width:2,material:col.withAlpha(.7)}}));
  pins.push(viewer.entities.add({id:'c'+i,position:Cesium.Cartesian3.fromDegrees(c.lng,c.lat,H),point:{pixelSize:c.items.length>1?20:14,color:col,outlineColor:Cesium.Color.WHITE,outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY},
   label:{text:c.items.length>1?c.items.length+'건':priceTxt(c.items[0]),font:'bold 13px sans-serif',pixelOffset:new Cesium.Cartesian2(0,-20),showBackground:true,backgroundColor:col.withAlpha(.85),fillColor:Cesium.Color.fromCssColorString('#0f172a'),disableDepthTestDistance:Number.POSITIVE_INFINITY,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,c.items.length>1?2500:900)}}))});
 document.getElementById('cnt').textContent='공개 매물 '+list.length+'건 표시 중';
 const L=document.getElementById('list');L.innerHTML='';
 list.slice(0,80).forEach(p=>{const el=document.createElement('div');el.className='item';
  el.innerHTML=`<b>${esc(p.dong)} ${esc(p.cat)}</b>${p.hp_pick?' <span class="tag" style="background:#f87171">'+esc(p.hp_pick)+'</span>':''}${p.has_photo?' 📷':''}<br><small>${priceTxt(p)} · ${walk(p)}</small>`;el.onclick=()=>show(p);L.appendChild(el)})}
document.getElementById('onlyPhoto').onchange=render;document.getElementById('deal').onchange=render;
function useData(d,fresh){PROPS=d.filter(p=>p.lat&&p.lng).map(p=>EXACT&&EXACT[p.id]?{...p,lat:EXACT[p.id].lat,lng:EXACT[p.id].lng}:p);const tb=document.getElementById('types');tb.className='chips';tb.innerHTML=TYPES.map(t=>{const n=t==='전체'?PROPS.length:PROPS.filter(p=>TYPE(p.cat)===t).length;return n?`<button class="chip${t===curType?' on':''}" data-t="${t}">${t} ${n}</button>`:''}).join('');
 tb.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curType=b.dataset.t;tb.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});render();
 const id=+location.hash.slice(1),hp=PROPS.find(p=>p.id===id);if(hp&&!window._opened){window._opened=1;show(hp)}}
async function boot(){
 try{const c=await (await fetch(ADM+'/sync/pub/config')).json();window.CFG=c;if(c.vworldKey&&vkey()!==c.vworldKey){try{localStorage.setItem('vwkey',c.vworldKey)}catch(e){}keyEl.placeholder='V월드 키 자동 적용됨 (바꿀 때만 입력)';setVworld(c.vworldKey);loadBuildings(c.vworldKey);$('style').value='vsat'}}catch(e){window.CFG={}}
 try{const r=await fetch(ADM+'/api/mv/coords',{credentials:'include'});if(r.ok){const a=await r.json();EXACT={};a.forEach(x=>EXACT[x.id]=x);$('adm').style.display='block'}}catch(e){}
 try{const c=JSON.parse(localStorage.getItem('h72props2')||'null');if(c)useData(c)}catch(e){}
fetch(API).then(r=>r.json()).then(d=>{useData(d);try{localStorage.setItem('h72props2',JSON.stringify(d))}catch(e){}})
 .catch(e=>document.getElementById('cnt').textContent='매물장부 불러오기 실패: '+e.message);}
new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas).setInputAction(e=>{const o=viewer.scene.pick(e.position);if(o&&o.id&&/^c\d+$/.test(String(o.id.id)))cellList(cells[+o.id.id.slice(1)])},Cesium.ScreenSpaceEventType.LEFT_CLICK);
// 혜화역 회전 투어
let tour=null;
function home(){viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat-0.012,1100),orientation:{pitch:Cesium.Math.toRadians(-40)}})}
document.getElementById('fly').onclick=()=>{if(tour){tour();tour=null;return home()}
 const c=Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat);let hd=0;
 tour=viewer.clock.onTick.addEventListener(()=>{hd+=0.003;viewer.camera.lookAt(c,new Cesium.HeadingPitchRange(hd,Cesium.Math.toRadians(-35),1300))});};
home();
// ── 추가 기능 ──
const $=id=>document.getElementById(id),toast=(t,ms=3500)=>{const e=$('toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);if(ms)e._t=setTimeout(()=>e.style.display='none',ms)};
let stopFns=[];function stopAll(){stopFns.forEach(f=>f());stopFns=[];if(tour){tour();tour=null}viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY)}
document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{stopAll();document.querySelectorAll('.mb').forEach(x=>x.classList.toggle('on',x===b));
 const s=viewer.scene,m=b.dataset.mode;m==='2d'?s.morphTo2D(1):m==='25d'?s.morphToColumbusView(1):s.morphTo3D(1)});
viewer.scene.morphComplete.addEventListener(()=>{if(viewer.scene.mode===Cesium.SceneMode.SCENE3D)return home();
 if(viewer.scene.mode===Cesium.SceneMode.COLUMBUS_VIEW)return viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat-0.011,1000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0}});
 viewer.camera.setView({destination:Cesium.Rectangle.fromDegrees(STATION.lon-.009,STATION.lat-.006,STATION.lon+.009,STATION.lat+.006)})});
const vkey=()=>{try{return localStorage.getItem('vwkey')||''}catch(e){return ''}};
$('style').onchange=e=>{const v=e.target.value,L=viewer.imageryLayers,k=vkey();
 if(v[0]==='v'&&!k){toast('V월드 인증키를 먼저 넣어 주세요');e.target.value='osm';return}
 L.removeAll();
 if(v==='osm')L.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));
 if(v==='dark'){const l=L.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));l.brightness=.35;l.contrast=1.3;l.saturation=.2;l.hue=.55}
 if(v==='vbase')L.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://api.vworld.kr/req/wmts/1.0.0/'+k+'/Base/{z}/{y}/{x}.png',maximumLevel:19,credit:'V월드'}));
 if(v==='vsat')setVworld(k)};
const ring=viewer.entities.values.find(e=>e.ellipse);
$('radius').onchange=e=>{const r=+e.target.value;ring.show=!!r;if(r){ring.ellipse.semiMajorAxis=r;ring.ellipse.semiMinorAxis=r}};
$('maxp').oninput=()=>render();
let routeEnt=null,walker=null;
window.routeTo=async (id,play=true)=>{const p=PROPS.find(x=>x.id===id);stopAll();toast('길 찾는 중…',0);let pts,dist;
 try{const r=await (await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/foot/'+STATION.lon+','+STATION.lat+';'+p.lng+','+p.lat+'?overview=full&geometries=geojson')).json();
  pts=r.routes[0].geometry.coordinates;dist=r.routes[0].distance}catch(e){pts=[[STATION.lon,STATION.lat],[p.lng,p.lat]];dist=null}
 window._route={id,pts};if(routeEnt)viewer.entities.remove(routeEnt);if(walker)viewer.entities.remove(walker);
 routeEnt=viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(pts.flat()),width:6,material:new Cesium.PolylineGlowMaterialProperty({glowPower:.25,color:Cesium.Color.fromCssColorString('#f43f5e')}),clampToGround:true}});
 toast(dist?(EXACT?'혜화역 → 매물 약 ':'혜화역 → 매물 구역 약 ')+Math.round(dist)+'m · 도보 약 '+Math.max(1,Math.round(dist/67))+'분'+(EXACT?'':' (위치는 100m 범위)'):'경로를 못 찾아 직선으로 표시합니다',8000);
 if(!play){viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(p.lng,p.lat,20),60),{offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-45),550),duration:1.5});return}
 const cart=pts.map(c=>Cesium.Cartographic.fromDegrees(c[0],c[1])),acc=[0];
 for(let i=1;i<cart.length;i++)acc.push(acc[i-1]+new Cesium.EllipsoidGeodesic(cart[i-1],cart[i]).surfaceDistance);
 const total=acc[acc.length-1],T=Math.min(25,Math.max(8,total/40));let t0=null;
 walker=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(pts[0][0],pts[0][1],3),point:{pixelSize:16,color:Cesium.Color.fromCssColorString('#f43f5e'),outlineColor:Cesium.Color.WHITE,outlineWidth:3,disableDepthTestDistance:Number.POSITIVE_INFINITY}});
 const at=s=>{let i=1;while(i<acc.length-1&&acc[i]<s)i++;const f=(s-acc[i-1])/Math.max(1e-6,acc[i]-acc[i-1]);
  return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]};
 let done=false;const rm=viewer.clock.onTick.addEventListener(()=>{if(done)return;const now=performance.now();if(t0===null)t0=now;const u=Math.min(1,(now-t0)/1000/T),s=u*total;
  const a=at(s),b=at(Math.min(total,s+25)),hd=Math.atan2((b[0]-a[0])*Math.cos(a[1]*Math.PI/180),b[1]-a[1]);
  const pos=Cesium.Cartesian3.fromDegrees(a[0],a[1],3);walker.position=pos;
  viewer.camera.lookAt(pos,new Cesium.HeadingPitchRange(hd,Cesium.Math.toRadians(-30),160));
  if(u>=1){done=true;viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);stopFns=stopFns.filter(f=>f!==stop);rm()}});
 const stop=()=>{done=true;rm()};stopFns.push(stop)};
let walkOn=false;
$('ptour').onclick=()=>{stopAll();let i=0;const go=()=>{const c=cells[i++%cells.length];if(!c)return;
 viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(c.lng,c.lat-0.003,300),orientation:{pitch:Cesium.Math.toRadians(-35)},duration:2.5});
 toast(c.items[0].dong+' · '+(c.items.length>1?c.items.length+'건':priceTxt(c.items[0])),4000)};go();const iv=setInterval(go,5000);stopFns.push(()=>clearInterval(iv))};
$('clean').onclick=()=>{document.body.classList.add('clean');toast('H 키를 누르면 메뉴가 다시 나옵니다')};
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!walkOn&&e.target.tagName!=='INPUT')document.body.classList.toggle('clean')});
$('share').onclick=()=>{navigator.clipboard.writeText(location.href).then(()=>toast('링크를 복사했습니다'),()=>toast(location.href,8000))};
viewer.scene.requestRenderMode=true;viewer.scene.maximumRenderTimeChange=Infinity;viewer.clock.onTick.addEventListener(()=>{if(stopFns.length||tour)viewer.scene.requestRender()});
['pointerdown','wheel','touchstart'].forEach(ev=>viewer.canvas.addEventListener(ev,()=>{if(!walkOn&&(stopFns.length||tour)){stopAll();toast('자동 이동을 멈췄습니다',1500)}},{passive:true}));
// 사진: 매물을 누를 때만 불러온다
window.openPhotos=async id=>{const box=$('photoBox');box.style.display='block';$('phMain').innerHTML='<small>사진 불러오는 중…</small>';$('phThumbs').innerHTML='';
 try{const d=await (await fetch(ADM+'/sync/pub/listing/'+id)).json();const ids=d.photos||[];
  if(!ids.length){box.style.display='none';return}
  const big=i=>$('phMain').innerHTML='<img src="'+ADM+'/sync/pub/photo/'+ids[i]+'" alt="매물 사진">';big(0);
  ids.forEach((pid,i)=>{const im=new Image();im.src=ADM+'/sync/pub/photo/'+pid;im.loading='lazy';im.onclick=()=>big(i);$('phThumbs').appendChild(im)})
 }catch(e){$('phMain').innerHTML='<small>사진을 불러오지 못했습니다</small>'}};
// 카카오 로드뷰: 매물 앞(관리자) 또는 근처 골목(일반), 경로를 따라 넘겨 보기
let kakaoP=null;function kakaoLoad(){if(kakaoP)return kakaoP;const k=(window.CFG||{}).kakaoJsKey;if(!k)return Promise.reject(new Error('카카오 키 없음'));
 kakaoP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+k+'&autoload=false';s.onload=()=>kakao.maps.load(ok);s.onerror=()=>{kakaoP=null;no(new Error('카카오 지도 불러오기 실패 (등록 도메인 확인)'))};document.head.appendChild(s)});return kakaoP}
let rv=null,rvc=null,rvPts=[],rvI=0;
function rvGo(i){rvI=Math.max(0,Math.min(rvPts.length-1,i));const [lng,lat]=rvPts[rvI],last=rvI===rvPts.length-1;
 rvc.getNearestPanoId(new kakao.maps.LatLng(lat,lng),last&&!EXACT?120:60,pid=>{if(pid){rv.setPanoId(pid,new kakao.maps.LatLng(lat,lng));$('rvNote').textContent=''}else $('rvNote').textContent='이 지점은 로드뷰 사진이 없습니다. 다음으로 넘겨 보세요.'});
 $('rvTitle').textContent=rvPts.length>1?('혜화역 → 매물 로드뷰 '+(rvI+1)+' / '+rvPts.length+(last?(EXACT?' · 매물 앞':' · 매물 근처'):'')):'로드뷰';}
window.openRV=async id=>{const p=PROPS.find(x=>x.id===id);$('photoBox').style.display='none';$('rvModal').style.display='flex';$('rvNote').textContent='로드뷰 불러오는 중…';
 try{await kakaoLoad()}catch(e){$('rvNote').textContent=e.message;return}
 if(!rv){rv=new kakao.maps.Roadview($('rv'));rvc=new kakao.maps.RoadviewClient()}
 // 경로가 있으면 약 60m 간격으로 넘겨 보기, 없으면 매물 지점만
 const r=window._route&&window._route.id===id?window._route.pts:null;rvPts=[];
 if(r){let acc=0,prev=r[0];rvPts.push(r[0]);for(const c of r){acc+=Math.hypot((c[0]-prev[0])*88000,(c[1]-prev[1])*111000);prev=c;if(acc>=60){rvPts.push(c);acc=0}}}
 rvPts.push([p.lng,p.lat]);rv.relayout&&rv.relayout();rvGo(rvPts.length-1)};
$('rvPrev').onclick=()=>rvGo(rvI-1);$('rvNext').onclick=()=>rvGo(rvI+1);$('rvClose').onclick=()=>$('rvModal').style.display='none';
boot();
