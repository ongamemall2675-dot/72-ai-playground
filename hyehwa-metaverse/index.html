<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>혜화72부동산 메타버스 · 대학로 혜화72공인중개사사무소</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
:root{--bg:#0f172a;--panel:rgba(15,23,42,.92);--fg:#e2e8f0;--accent:#38bdf8;--muted:#94a3b8}
html,body,#map{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:'Pretendard','Noto Sans KR',sans-serif}
#ui{position:absolute;top:12px;left:12px;width:300px;max-width:calc(100% - 32px);max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border-radius:12px;padding:14px;box-sizing:border-box;z-index:10}
h1{font-size:17px;margin:0 0 4px}small{color:var(--muted)}
input,select,button{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #334155;background:#1e293b;color:var(--fg)}
button{background:var(--accent);color:#0f172a;font-weight:700;cursor:pointer;border:0}
.item{padding:8px;border-radius:8px;background:#1e293b;margin:6px 0;cursor:pointer}.item:hover{outline:1px solid var(--accent)}
.item b{color:var(--accent)}
.grp{border:2px solid #facc15;border-radius:10px;background:rgba(250,204,21,.08);padding:6px;margin:10px 0}.grp .gh{color:#facc15;font-weight:700;cursor:pointer;padding:2px 4px}.grp .gn{background:#facc15;color:#0f172a;border-radius:10px;padding:1px 8px;margin-left:4px}.grp .item{margin:5px 0 0 8px;border-left:3px solid #facc15}
#detail{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#0b1220;border:1px solid var(--accent)}
.cesium-viewer-bottom{display:none}
#detail img{width:100%;border-radius:6px;margin-bottom:6px}
a.cta{display:block;text-align:center;margin-top:8px;padding:9px;border-radius:8px;background:var(--accent);color:#0f172a;font-weight:700;text-decoration:none}
.row{display:flex;gap:6px}.row>*{flex:1}.mb{background:#334155;color:var(--fg)}.mb.on{background:var(--accent);color:#0f172a}.sub{background:#334155;color:var(--fg);font-size:13px}
#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);padding:10px 16px;border-radius:10px;border:1px solid var(--accent);display:none;z-index:11;max-width:80%}
body.clean #ui{display:none}
.pop{position:absolute;top:12px;right:12px;width:360px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px;z-index:12;display:none}
.pop .x,.rvbar button{width:auto;padding:4px 10px;margin:0 0 0 4px;background:#334155;color:var(--fg)}.pop .x{float:right}
#phMain img{width:100%;border-radius:8px;max-height:60vh;object-fit:contain;background:#000}#phThumbs{display:flex;gap:4px;overflow:auto}#phThumbs img{height:54px;border-radius:4px;cursor:pointer;opacity:.7}#phThumbs img:hover{opacity:1}
#rvModal{position:absolute;inset:5% 5% 5% 330px;background:#0f172a;border:1px solid var(--accent);border-radius:12px;z-index:13;display:none;flex-direction:column;padding:8px}
@media(max-width:800px){#rvModal{inset:8px}}
.rvbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#rv{flex:1;border-radius:8px;overflow:hidden}
#card{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:min(620px,94vw);height:min(640px,88vh);background:#0f172a;border:1px solid var(--accent);border-radius:14px;z-index:14;display:none;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cHead{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 6px}.cHead .x{width:auto;padding:4px 10px;margin:0;background:#334155;color:var(--fg)}
#cTitle .price{font-size:22px;font-weight:800;margin:4px 0}.cTabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid #334155}
.cTabs button{width:auto;margin:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:8px 14px}.cTabs button.on{background:#1e293b;color:var(--accent)}
.cBody{flex:1;overflow:auto;padding:14px 16px}.pane{display:none;height:100%}.pane.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}.grid div{background:#1e293b;border-radius:8px;padding:8px}.grid small{display:block;color:var(--muted);font-size:11px}
.st{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid #1e293b;cursor:pointer;border-radius:6px}.st:hover{background:#1e293b}.st small{color:var(--muted)}.st .ph{color:#34d399;white-space:nowrap}
.desc{white-space:pre-wrap;line-height:1.6;font-size:14px;background:#1e293b;border-radius:8px;padding:10px}
#p-ph .big{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:8px}#p-ph .th{display:flex;gap:4px;overflow:auto;margin-top:6px}#p-ph .th img{height:60px;border-radius:4px;cursor:pointer}
#card.wide{width:min(980px,96vw);height:min(820px,94vh)}#card.wide .cBody{padding:6px}
@media(max-width:800px){#card{right:3vw}}
#p-rv #rvWrap{display:flex;flex-direction:column;height:100%}#p-rv #rv{min-height:380px}
#adm{display:none;font-size:12px;color:#facc15}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chip{width:auto;padding:5px 10px;margin:0;font-size:13px;background:#334155;color:var(--fg)}.chip.on{background:var(--accent);color:#0f172a}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;color:#0f172a}
</style>
</head>
<body>
<div id="map"></div><div id="toast"></div>
<div id="photoBox" class="pop"><button class="x" onclick="this.parentNode.style.display='none'">✕</button><div id="phMain"></div><div id="phThumbs"></div></div>
<div id="rvModal"><div id="rvWrap"><div class="rvbar"><b id="rvTitle">로드뷰</b><span><button id="rvPrev">◀ 이전</button><button id="rvNext">다음 ▶</button><button id="rvClose">✕ 닫기</button></span></div><div id="rv"></div><small id="rvNote"></small></div></div>
<div id="card"><div class="cHead"><div id="cTitle"></div><button class="x" onclick="closeCard()">✕</button></div><div class="cTabs"><button data-p="info" class="on">매물 정보</button><button data-p="ph">사진</button><button data-p="rv">로드뷰</button><button data-p="land">건물·토지</button><button data-p="st">상점</button></div><div class="cBody"><div id="p-info" class="pane"></div><div id="p-ph" class="pane"></div><div id="p-rv" class="pane"></div><div id="p-land" class="pane"></div><div id="p-st" class="pane"></div></div></div>
<div id="ui">
  <h1>🏙 혜화<span style="color:#facc15;font-size:1.25em;font-weight:900">72</span>부동산 메타버스</h1>
  <small>V월드 지도 · 대학로 혜화72공인중개사사무소 공개 매물</small>
  <input id="key" style="display:none" autocomplete="off" placeholder="V월드 API 인증키 (vworld.kr 발급)">
  <button id="applyKey" style="display:none">V월드 위성지도 + 3D 건물 적용</button>
  <small id="bstat"></small><div id="adm">🔑 관리자 모드: 정확한 위치로 경로·로드뷰를 보여 줍니다 (브리핑용)</div>
  <div id="types"></div><label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="onlyPhoto" style="width:auto;margin:0">📷 사진 있는 매물만</label>
  <select id="deal"><option value="">전체 거래</option><option>매매</option><option>전세</option><option>월세</option></select>
  <small id="cnt">매물장부 불러오는 중…</small>
  <div class="row"><button data-mode="2d" class="mb on">2D</button><button data-mode="25d" class="mb">2.5D</button><button data-mode="3d" class="mb">3D</button></div>
  <div class="row"><select id="style"><option value="vbase">기본 지도</option><option value="vcad">지적도 (땅 경계)</option><option value="vsat">위성 사진</option><option value="osm">일반 지도(OSM)</option><option value="dark">야간 지도</option></select>
  <select id="radius"><option value="500">반경 500m</option><option value="250">반경 250m</option><option value="1000">반경 1km</option><option value="0">반경 숨김</option></select></div>
  <input id="maxp" type="number" placeholder="최대 금액 (만원, 매매가·보증금)">
  <div class="row"><button id="clean" class="sub">🎥 촬영 화면 (H)</button><button id="share" class="sub">🔗 링크 복사</button></div>
  <button id="fly" style="background:#334155;color:var(--fg)">📍 혜화역으로 이동 / 회전 투어</button>
  <div id="detail"></div>
  <div id="list"></div>
</div>
<script>
const STATION={lon:127.0018,lat:37.5822},OFFICE={lon:127.000848,lat:37.584835};
// 실제 매물: 업무관리 공개 매물 통로(홈페이지 공개 + 계약가능). 좌표는 통로가 주는 약 100m 단위 좌표만 쓴다(정확한 주소 노출 방지).
const ADM='https://admin.hyehwa72.org',API=ADM+'/sync/pub/listings?lite=1', SITE='https://hyehwa72.org/listing/';
let EXACT=null,RAW=null;
const TYPES=['전체','원룸·투룸','주택','오피스텔','상가','사무실','건물'];
const TYPE=c=>/원룸|투룸/.test(c)?'원룸·투룸':/3룸|빌라|단독|다가구|아파트/.test(c)?'주택':/오피스텔/.test(c)?'오피스텔':/상가/.test(c)?'상가':/사무실/.test(c)?'사무실':/건물/.test(c)?'건물':'주택';
let curType='전체';
const GROUP=c=>/상가|사무실/.test(c)?'상가·사무실':/원룸|투룸|3룸/.test(c)?'주거 임대':/오피스텔/.test(c)?'오피스텔':'매매 주택·건물';
const COLORS={'상가·사무실':'#f59e0b','주거 임대':'#34d399','오피스텔':'#a78bfa','매매 주택·건물':'#38bdf8'};
Cesium.Camera.DEFAULT_VIEW_RECTANGLE=Cesium.Rectangle.fromDegrees(OFFICE.lon-.006,OFFICE.lat-.004,OFFICE.lon+.006,OFFICE.lat+.004);Cesium.Camera.DEFAULT_VIEW_FACTOR=0;
const viewer=new Cesium.Viewer('map',{sceneMode:Cesium.SceneMode.SCENE2D,mapProjection:new Cesium.WebMercatorProjection(),baseLayer:Cesium.ImageryLayer.fromProviderAsync(Promise.resolve(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}))),
 baseLayerPicker:false,geocoder:false,timeline:false,animation:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,infoBox:false});
viewer.scene.globe.depthTestAgainstTerrain=false;
function setVworld(key){
  viewer.imageryLayers.removeAll();
  viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:`https://api.vworld.kr/req/wmts/1.0.0/${key}/Satellite/{z}/{y}/{x}.jpeg`,maximumLevel:19,credit:'V월드'}));
  viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:`https://api.vworld.kr/req/wmts/1.0.0/${key}/Hybrid/{z}/{y}/{x}.png`,maximumLevel:19}));
}
let saved='';try{saved=localStorage.getItem('vwkey')||''}catch(e){}
const keyEl=document.getElementById('key');if(saved)keyEl.placeholder='V월드 키 적용됨 (바꿀 때만 입력)';
document.getElementById('applyKey').onclick=()=>{const k=keyEl.value.trim()||(localStorage.getItem('vwkey')||'');if(!k)return alert('V월드 인증키를 입력하세요');try{localStorage.setItem('vwkey',k)}catch(e){}setVworld(k);loadBuildings(k)};
// ── V월드 3D 건물: 도로명주소 건물(LT_C_SPBD) 폴리곤을 지상층수×3m로 돌출 ──
const bstat=document.getElementById('bstat');let bldSrc=null;
function jsonp(url){return new Promise((ok,no)=>{const cb='vw'+Math.random().toString(36).slice(2);const s=document.createElement('script');
 const t=setTimeout(()=>{cleanup();no(new Error('timeout'))},15000);
 function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=d=>{cleanup();ok(d)};s.onerror=()=>{cleanup();no(new Error('load'))};s.src=url+'&callback='+cb;document.head.appendChild(s)})}
function loadBuildings(){} // 3D 건물 상자는 쓰지 않음(대표 결정 11-06: 위성·지도만)
if(saved)loadBuildings(saved);
// 혜화역 마커
viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat,5),point:{pixelSize:14,color:Cesium.Color.fromCssColorString('#3b82f6'),outlineColor:Cesium.Color.WHITE,outlineWidth:3},
 label:{text:'🚇 혜화역',font:'bold 16px sans-serif',pixelOffset:new Cesium.Cartesian2(0,-24),fillColor:Cesium.Color.WHITE,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE}});
viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(STATION.lon,STATION.lat),ellipse:{semiMajorAxis:500,semiMinorAxis:500,material:Cesium.Color.fromCssColorString('#3b82f6').withAlpha(.08),outline:true,outlineColor:Cesium.Color.fromCssColorString('#3b82f6')}});
// ── 매물 핀: 같은 100m 칸의 매물은 핀 하나로 묶는다 ──
let PROPS=[],cells=[],pins=[];
const dealOf=p=>p.deal||((+p.rent)>0?'월세':(p.deposit?'전세':'임대'));
const won=v=>{v=+v;if(!v)return '';const e=Math.floor(v/10000),m=v%10000;return (e?e+'억':'')+(m?(e?' ':'')+m.toLocaleString()+'만':'')};
function priceTxt(p){if(p.deal==='매매')return '매매 '+won(p.price);
 const d=p.deposit?won(p.deposit):'',r=(+p.rent)?' / 월 '+(+p.rent).toLocaleString()+'만':'';return dealOf(p)+' '+(d||'협의')+r}
function walk(p){try{const a=JSON.parse(p.near_st).st,s=a.find(x=>x.name==='혜화역')||a[0];return s?s.name+' 도보 약 '+s.min+'분':''}catch(e){return ''}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const detail=document.getElementById('detail');
function show(p){stopAll();detail.style.display='none';$('photoBox').style.display='none';routeTo(p.id,false);openCard(p)}
let cardP=null;
function tab(n){document.querySelectorAll('.cTabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===n));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+n));
 if(n==='rv')cardRV();if(n==='land')cardLand();if(n==='st')cardStores()}
function closeCard(){$('card').style.display='none';$('card').classList.remove('wide');if(typeof embedded!=='undefined'&&embedded){embedded=false;$('p-info').innerHTML='';fetch(API+'&t='+Date.now()).then(r=>r.json()).then(d=>{useData(d);try{localStorage.setItem('h72props2',JSON.stringify(d))}catch(e){}}).catch(()=>{})}if(typeof pickEnt!=='undefined'&&pickEnt){viewer.dataSources.remove(pickEnt);pickEnt=null;viewer.scene.requestRender()}if($('p-rv').contains($('rvWrap')))$('rvModal').appendChild($('rvWrap'))}
const cell=(k,v)=>v?'<div><small>'+k+'</small>'+esc(v)+'</div>':'';
async function openCard(p){cardP=p;const g=GROUP(p.cat);$('card').style.display='flex';
 $('cTitle').innerHTML='<span class="tag" style="background:'+COLORS[g]+'">'+esc(p.cat)+'</span>'+(p.hp_pick?'<span class="tag" style="background:#f87171">'+esc(p.hp_pick)+'</span>':'')+' <b>'+esc(p.dong)+' '+esc(p.bldg_type||'')+'</b><div class="price" style="color:'+COLORS[g]+'">'+priceTxt(p)+'</div><small>매물번호 '+p.id+' · '+walk(p)+'</small>';
 const phB=document.querySelector('.cTabs [data-p="ph"]');phB.style.display=p.has_photo?'':'none';phB.textContent='사진';tab('info');
 $('p-info').innerHTML='<small>불러오는 중…</small>';$('p-land').innerHTML='';$('p-land').dataset.id='';$('p-st').innerHTML='';$('p-st').dataset.id='';document.querySelectorAll('.cTabs button').forEach(b=>b.style.display='');$('p-ph').innerHTML='';
 let d=p;try{d={...p,...await (await fetch(ADM+'/sync/pub/listing/'+p.id)).json()}}catch(e){}
 if(cardP!==p)return;p._d=d;
 $('p-info').innerHTML='<div class="grid">'+cell('가격',priceTxt(d))+cell('관리비',d.mgmt?d.mgmt+'만원':'')+cell('권리금',d.premium)+cell('면적',d.area_py||(d.excl_m2?d.excl_m2+'㎡':''))+cell('전용면적',d.excl_m2?d.excl_m2+'㎡':'')+cell('해당층',d.floor)+cell('방/욕실',[d.rooms,d.baths].filter(Boolean).join(' · '))+cell('방향',d.direction)+cell('입주가능',d.move_in)+cell('주차',d.parking)+cell('엘리베이터',d.elevator)+'</div>'
  +(d.features?'<p><b>'+esc(d.features)+'</b></p>':'')+'<div class="desc">'+esc(d.ad_desc||'')+'</div>'
  +(EXACT&&EXACT[p.id]?'<button class="cta" style="width:100%;border:0;cursor:pointer;background:#22c55e" onclick="addHere('+p.id+')">➕ 이 건물에 매물 추가 입력 (다른 층·호수)</button>':'')+'<a class="cta" href="'+SITE+p.id+'" target="_blank">홈페이지에서 보기 · 문의하기</a><a class="cta" href="https://pf.kakao.com/_virmX/chat" target="_blank" style="background:#FEE500;color:#191919">💬 카카오톡으로 문의 (매물번호 '+p.id+')</a><p><small>대학로혜화72공인중개사사무소 · 02-766-0720 · 위치는 '+(EXACT?'정확한 위치(관리자)':'약 100m 범위로 표시')+'</small></p>';
 if(d.photos&&d.photos.length){const big=i=>$('p-ph').querySelector('.big').src=ADM+'/sync/pub/photo/'+d.photos[i];
  $('p-ph').innerHTML='<img class="big" alt="매물 사진"><div class="th">'+d.photos.map((x,i)=>'<img loading="lazy" data-i="'+i+'" src="'+ADM+'/sync/pub/photo/'+x+'">').join('')+'</div>';
  $('p-ph').querySelectorAll('.th img').forEach(im=>im.onclick=()=>big(+im.dataset.i));big(0);phB.textContent='사진 '+d.photos.length;phB.style.display=''}
}
function cardRV(){if(!$('p-rv').contains($('rvWrap')))$('p-rv').appendChild($('rvWrap'));$('rvClose').style.display='none';openRV(cardP.id,true)}
async function cardLand(){const p=cardP,d=p._d||p,el=$('p-land');if(el.dataset.id==p.id)return;el.dataset.id=p.id;
 let h='<h4 style="margin:4px 0">매물 건물 정보</h4><div class="grid">'+cell('건물 유형',d.bldg_type||d.sub_kind)+cell('주용도',d.usage)+cell('규모',d.total_floors)+cell('사용승인일',d.approval_date)+cell('주차',d.parking)+cell('엘리베이터',d.elevator)+'</div><small>건축물대장 기준 (업무관리 매물장부)</small>';
 if(!EXACT){el.innerHTML=h+'<p><small>정확한 지번·공시지가·도로명주소는 매물 위치가 드러나 공개하지 않습니다. 문의하시면 안내해 드립니다.</small></p>';return}
 el.innerHTML=h+'<p><small>V월드 조회 중…</small></p>';const k=vkey(),pt='POINT('+p.lng+' '+p.lat+')';
 const q=ds=>jsonp('https://api.vworld.kr/req/data?service=data&request=GetFeature&data='+ds+'&key='+k+'&domain='+encodeURIComponent(location.origin)+'&format=json&size=1&geometry=false&attribute=true&crs=EPSG:4326&geomFilter='+pt).then(r=>r.response.status==='OK'?r.response.result.featureCollection.features[0].properties:null).catch(()=>null);

// 지적선: V월드 연속지적도(LP_PA_CBND_BUBUN)를 확대했을 때 화면 범위만 받아 선으로 그림
let cadOn=false,cadSrc=null,cadKey='',cadT=null;
function viewRect(){let r=viewer.camera.computeViewRectangle();if(r)return r;const c=viewer.canvas,el=viewer.scene.globe.ellipsoid,pts=[[0,0],[c.clientWidth,c.clientHeight]].map(([x,y])=>viewer.camera.pickEllipsoid(new Cesium.Cartesian2(x,y),el));if(pts.some(p=>!p))return null;const a=Cesium.Cartographic.fromCartesian(pts[0]),b=Cesium.Cartographic.fromCartesian(pts[1]);return new Cesium.Rectangle(Math.min(a.longitude,b.longitude),Math.min(a.latitude,b.latitude),Math.max(a.longitude,b.longitude),Math.max(a.latitude,b.latitude))}
async function cadLoad(){if(!cadOn)return;const r=viewRect();if(!r)return;
 const W_=Cesium.Math.toDegrees(r.west),S_=Cesium.Math.toDegrees(r.south),E_=Cesium.Math.toDegrees(r.east),N_=Cesium.Math.toDegrees(r.north);
 if(E_-W_>0.012){if(cadSrc)cadSrc.show=false;return}
 const f=v=>Math.round(v*500)/500,box=[f(W_)-.002,f(S_)-.002,f(E_)+.002,f(N_)+.002],key=box.join(',');if(key===cadKey){cadSrc&&(cadSrc.show=true);return}cadKey=key;
 const feats=[];try{for(let pg=1;pg<=4;pg++){const r2=await jsonp('https://api.vworld.kr/req/data?service=data&request=GetFeature&data=LP_PA_CBND_BUBUN&key='+vkey()+'&domain='+encodeURIComponent(location.origin)+'&format=json&size=1000&page='+pg+'&geometry=true&attribute=false&crs=EPSG:4326&geomFilter=BOX('+box.join(',')+')');
  const rs=r2.response;if(rs.status!=='OK')break;feats.push(...rs.result.featureCollection.features);if(pg>=+rs.page.total)break}}catch(e){}
 if(key!==cadKey||!feats.length)return;const ds=await Cesium.GeoJsonDataSource.load({type:'FeatureCollection',features:feats},{stroke:Cesium.Color.fromCssColorString('#f59e0b'),fill:Cesium.Color.TRANSPARENT,strokeWidth:1.5});
 if(cadSrc)viewer.dataSources.remove(cadSrc);cadSrc=ds;ds.entities.values.forEach(e=>{if(e.polygon){e.polygon.outline=false;e.polyline=new Cesium.PolylineGraphics({positions:e.polygon.hierarchy.getValue().positions.concat([e.polygon.hierarchy.getValue().positions[0]]),width:1.5,material:Cesium.Color.fromCssColorString('#f59e0b').withAlpha(.9),clampToGround:false});e.polygon=undefined}});
 viewer.dataSources.add(ds);viewer.scene.requestRender()}
viewer.camera.moveEnd.addEventListener(()=>{clearTimeout(cadT);cadT=setTimeout(cadLoad,300)});
if(vkey()){$('style').value='vbase';$('style').onchange({target:$('style')})}
let routeEnt=null,walker=null;
window.routeTo=async (id,play=true)=>{const p=PROPS.find(x=>x.id===id);stopAll();toast('길 찾는 중…',0);let pts,dist;
 try{const r=await (await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/foot/'+STATION.lon+','+STATION.lat+';'+p.lng+','+p.lat+'?overview=full&geometries=geojson')).json();
  pts=r.routes[0].geometry.coordinates;dist=r.routes[0].distance}catch(e){pts=[[STATION.lon,STATION.lat],[p.lng,p.lat]];dist=null}
 window._route={id,pts};if(routeEnt)viewer.entities.remove(routeEnt);if(walker)viewer.entities.remove(walker);
 routeEnt=viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(pts.flat()),width:6,material:new Cesium.PolylineGlowMaterialProperty({glowPower:.25,color:Cesium.Color.fromCssColorString('#f43f5e')}),clampToGround:true}});
 toast(dist?(EXACT?'혜화역 → 매물 약 ':'혜화역 → 매물 구역 약 ')+Math.round(dist)+'m · 도보 약 '+Math.max(1,Math.round(dist/67))+'분'+(EXACT?'':' (위치는 100m 범위)'):'경로를 못 찾아 직선으로 표시합니다',8000);
 if(!play){viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(p.lng,p.lat,20),60),{offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-45),550),duration:1.5});return}
 const cart=pts.map(c=>Cesium.Cartographic.fromDegrees(c[0],c[1])),acc=[0];
 for(let i=1;i<cart.length;i++)acc.push(acc[i-1]+new Cesium.EllipsoidGeodesic(cart[i-1],cart[i]).surfaceDistance);
 const total=acc[acc.length-1],T=Math.min(25,Math.max(8,total/40));let t0=null;
 walker=viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(pts[0][0],pts[0][1],3),point:{pixelSize:16,color:Cesium.Color.fromCssColorString('#f43f5e'),outlineColor:Cesium.Color.WHITE,outlineWidth:3,disableDepthTestDistance:Number.POSITIVE_INFINITY}});
 const at=s=>{let i=1;while(i<acc.length-1&&acc[i]<s)i++;const f=(s-acc[i-1])/Math.max(1e-6,acc[i]-acc[i-1]);
  return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]};
 let done=false;const rm=viewer.clock.onTick.addEventListener(()=>{if(done)return;const now=performance.now();if(t0===null)t0=now;const u=Math.min(1,(now-t0)/1000/T),s=u*total;
  const a=at(s),b=at(Math.min(total,s+25)),hd=Math.atan2((b[0]-a[0])*Math.cos(a[1]*Math.PI/180),b[1]-a[1]);
  const pos=Cesium.Cartesian3.fromDegrees(a[0],a[1],3);walker.position=pos;
  viewer.camera.lookAt(pos,new Cesium.HeadingPitchRange(hd,Cesium.Math.toRadians(-30),160));
  if(u>=1){done=true;viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);stopFns=stopFns.filter(f=>f!==stop);rm()}});
 const stop=()=>{done=true;rm()};stopFns.push(stop)};
let walkOn=false;
$('clean').onclick=()=>{document.body.classList.add('clean');toast('H 키를 누르면 메뉴가 다시 나옵니다')};
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!walkOn&&e.target.tagName!=='INPUT')document.body.classList.toggle('clean')});
$('share').onclick=()=>{navigator.clipboard.writeText(location.href).then(()=>toast('링크를 복사했습니다'),()=>toast(location.href,8000))};
viewer.scene.requestRenderMode=true;viewer.scene.maximumRenderTimeChange=Infinity;viewer.clock.onTick.addEventListener(()=>{if(stopFns.length||tour)viewer.scene.requestRender()});
['pointerdown','wheel','touchstart'].forEach(ev=>viewer.canvas.addEventListener(ev,()=>{if(!walkOn&&(stopFns.length||tour)){stopAll();toast('자동 이동을 멈췄습니다',1500)}},{passive:true}));
// 사진: 매물을 누를 때만 불러온다
window.openPhotos=async id=>{const box=$('photoBox');box.style.display='block';$('phMain').innerHTML='<small>사진 불러오는 중…</small>';$('phThumbs').innerHTML='';
 try{const d=await (await fetch(ADM+'/sync/pub/listing/'+id)).json();const ids=d.photos||[];
  if(!ids.length){box.style.display='none';return}
  const big=i=>$('phMain').innerHTML='<img src="'+ADM+'/sync/pub/photo/'+ids[i]+'" alt="매물 사진">';big(0);
  ids.forEach((pid,i)=>{const im=new Image();im.src=ADM+'/sync/pub/photo/'+pid;im.loading='lazy';im.onclick=()=>big(i);$('phThumbs').appendChild(im)})
 }catch(e){$('phMain').innerHTML='<small>사진을 불러오지 못했습니다</small>'}};
// 카카오 로드뷰: 매물 앞(관리자) 또는 근처 골목(일반), 경로를 따라 넘겨 보기
let kakaoP=null;function kakaoLoad(){if(kakaoP)return kakaoP;const k=(window.CFG||{}).kakaoJsKey;if(!k)return Promise.reject(new Error('카카오 키 없음'));
 kakaoP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+k+'&libraries=services&autoload=false';s.onload=()=>kakao.maps.load(ok);s.onerror=()=>{kakaoP=null;no(new Error('카카오 지도 불러오기 실패 (등록 도메인 확인)'))};document.head.appendChild(s)});return kakaoP}
let rv=null,rvc=null,rvPts=[],rvI=0;
function rvGo(i){rvI=Math.max(0,Math.min(rvPts.length-1,i));const [lng,lat]=rvPts[rvI],last=rvI===rvPts.length-1;
 rvc.getNearestPanoId(new kakao.maps.LatLng(lat,lng),last&&!EXACT?120:60,pid=>{if(pid){rv.setPanoId(pid,new kakao.maps.LatLng(lat,lng));$('rvNote').textContent=''}else $('rvNote').textContent='이 지점은 로드뷰 사진이 없습니다. 다음으로 넘겨 보세요.'});
 $('rvTitle').textContent=rvPts.length>1?('혜화역 → 매물 로드뷰 '+(rvI+1)+' / '+rvPts.length+(last?(EXACT?' · 매물 앞':' · 매물 근처'):'')):'로드뷰';}
window.openRV=async (id,inCard)=>{const p=PROPS.find(x=>x.id===id);$('photoBox').style.display='none';if(!inCard)$('rvModal').style.display='flex';$('rvNote').textContent='로드뷰 불러오는 중…';
 try{await kakaoLoad()}catch(e){$('rvNote').textContent=e.message;return}
 if(!rv){rv=new kakao.maps.Roadview($('rv'));rvc=new kakao.maps.RoadviewClient()}
 // 경로가 있으면 약 60m 간격으로 넘겨 보기, 없으면 매물 지점만
 const r=window._route&&window._route.id===id?window._route.pts:null;rvPts=[];
 if(r){let acc=0,prev=r[0];rvPts.push(r[0]);for(const c of r){acc+=Math.hypot((c[0]-prev[0])*88000,(c[1]-prev[1])*111000);prev=c;if(acc>=60){rvPts.push(c);acc=0}}}
 rvPts.push([p.lng,p.lat]);rv.relayout&&rv.relayout();rvGo(rvPts.length-1)};
$('rvPrev').onclick=()=>rvGo(rvI-1);$('rvNext').onclick=()=>rvGo(rvI+1);$('rvClose').onclick=()=>$('rvModal').style.display='none';
boot();
